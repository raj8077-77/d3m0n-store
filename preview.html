<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07060c" />
  <title>Product · D3M0N.IN</title>
  <link rel="icon" href="https://ik.imagekit.io/silentgamers/Picsart_26-10-03_02-00-17-755.png?updatedAt=1790973036512&ik-s=cb860e00d6fdf3a8e6886e7b6a485ebc47ca2209" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <header>
    <a class="nav-btn" href="catalog.html" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18 9 12l6-6"/></svg></a>
    <div class="brand">D3M0N<b>.IN</b></div>
    <span></span>
  </header>
  <main>
    <div class="split" id="view"></div>
    <p class="notice" id="notice"></p>
  </main>
  <script src="js/core.js"></script>
  <script src="js/player.js"></script>
  <script>
    D3.protect();
    function bullets(list) {
      return (list || []).map(function (x) { return "<li>" + x + "</li>"; }).join("");
    }
    function render(data, p) {
      document.title = p.name + " · D3M0N.IN";
      document.getElementById("notice").textContent = data.notice || "";
      var frames = (p.images || []).map(function (src) {
        return '<div class="frame"><img alt="" src="' + src + '"></div>';
      }).join("");
      var shops = (p.marketplaces || []).map(function (s) {
        return '<div class="row"><div><b>' + s.name + '</b><span>' + (s.disadvantages || "") + '</span></div><b class="price">' + s.price + '</b></div>';
      }).join("");
      document.getElementById("view").innerHTML =
        '<div class="media"><p class="kicker">#' + p.id + '</p><h1 class="copy" style="margin-top:6px;font-size:1.6rem">' + p.fullName + '</h1>' +
        '<div class="stage" id="stage" style="margin-top:12px"><div class="track" id="track" style="gap:0">' + frames + '</div></div><div class="dots" id="dots"></div>' +
        '<div id="player"></div></div>' +
        '<section class="sheet"><h2 class="kicker">Description</h2><p class="desc copy">' + p.description + '</p>' +
        '<div class="price" style="margin-top:10px;font-size:1.3rem">' + p.price + '</div>' +
        '<div class="chips">' + p.keywords.map(function (k) { return '<span class="chip">' + k + '</span>'; }).join("") + '</div>' +
        '<hr class="sep"><h2 class="kicker">Comparison</h2><div class="cmp">' +
        '<article><h3>AI</h3><ul>' + bullets(p.comparison.ai) + '</ul></article>' +
        '<article><h3>Ours</h3><ul>' + bullets(p.comparison.ours) + '</ul></article>' +
        '<article><h3>Others</h3><ul>' + bullets(p.comparison.others) + '</ul></article></div>' +
        '<hr class="sep"><h2 class="kicker">Other places</h2>' + shops +
        '<button class="buy" id="buy" type="button">Buy Now</button></section>';
      var stage = document.getElementById("stage"), track = document.getElementById("track"), dots = document.getElementById("dots"), at = 0;
      dots.innerHTML = (p.images || []).map(function (_, i) { return '<i class="' + (i === 0 ? "on" : "") + '"></i>'; }).join("");
      function go(i) {
        at = Math.max(0, Math.min((p.images.length || 1) - 1, i));
        var w = stage.clientWidth;
        Array.from(track.children).forEach(function (f) { f.style.flex = "0 0 " + w + "px"; f.style.width = w + "px"; });
        track.style.transform = "translateX(" + (-at * w) + "px)";
        Array.from(dots.children).forEach(function (d, k) { d.className = k === at ? "on" : ""; });
      }
      var x0 = 0;
      stage.addEventListener("touchstart", function (e) { x0 = e.changedTouches[0].clientX; }, { passive: true });
      stage.addEventListener("touchend", function (e) {
        var dx = e.changedTouches[0].clientX - x0;
        if (dx < -28) go(at + 1); else if (dx > 28) go(at - 1);
      });
      go(0);
      window.addEventListener("resize", function () { go(at); });
      document.getElementById("buy").onclick = function () { D3.buy(p); };
      mountPlayer(document.getElementById("player"), p.youtubeId, (p.images && p.images[0]) || data.endThumb);
    }
    function openFromHash(data) {
      var id = parseInt(String(location.hash || "#1").replace("#", ""), 10);
      var p = D3.byId(data, id) || data.products[0];
      if (!p) return;
      render(data, p);
    }
    D3.load().then(function (data) {
      openFromHash(data);
      window.addEventListener("hashchange", function () { openFromHash(data); });
    }).catch(function () {
      document.getElementById("view").innerHTML = '<p class="empty">Product could not be opened.</p>';
    });
  </script>
</body>
</html>
