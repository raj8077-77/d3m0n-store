  <script src="js/core.js"></script>
  <script src="js/player.js"></script>
  <script>
    D3.protect();
    var raidOn = false;
    document.getElementById("raidBtn").onclick = function () {
      raidOn = !raidOn;
      document.getElementById("raid").style.display = raidOn ? "block" : "none";
      var a = document.getElementById(raidOn ? "police" : "funny");
      if (a) { a.currentTime = 0; var p = a.play(); if (p) p.catch(function () {}); }
    };
    document.getElementById("raid").style.display = "none";
    D3.load().then(function (data) {
      document.getElementById("notice").textContent = data.notice || "";
      var offer = D3.byId(data, data.offer);
      if (offer) {
        document.getElementById("offer").innerHTML =
          '<a class="offer" href="preview.html#' + offer.id + '"><img alt="" src="' + (offer.images[0] || "") + '"><div><span class="kicker">Latest offer</span><b class="copy">#' + offer.id + ' ' + offer.name + '</b><i class="price">' + offer.price + '</i></div></a>';
      }
      var track = document.getElementById("track");
      var at = 0;
      track.innerHTML = data.products.map(function (p, i) {
        return '<a class="slot' + (i === 0 ? " main" : "") + '" href="preview.html#' + p.id + '"><img alt="" src="' + (p.images[0] || "") + '"><div class="meta"><h3 class="copy">' + p.name + '</h3><div class="price">' + p.price + '</div></div></a>';
      }).join("");
      function go(i) {
        at = Math.max(0, Math.min(data.products.length - 1, i));
        var slot = track.children[0];
        var w = slot ? slot.getBoundingClientRect().width + 12 : 180;
        track.style.transform = "translateX(" + (-at * w) + "px)";
        Array.from(track.children).forEach(function (el, k) { el.classList.toggle("main", k === at); });
      }
      var startX = 0;
      track.parentElement.addEventListener("touchstart", function (e) { startX = e.changedTouches[0].clientX; }, { passive: true });
      track.parentElement.addEventListener("touchend", function (e) {
        var dx = e.changedTouches[0].clientX - startX;
        if (dx < -28) go(at + 1);
        else if (dx > 28) go(at - 1);
      });
      mountPlayer(document.getElementById("player"), D3.ytId(data.homeVideo), data.endThumb);
    }).catch(function () {
      document.getElementById("notice").textContent = "Catalog could not be opened.";
    });
  </script>
